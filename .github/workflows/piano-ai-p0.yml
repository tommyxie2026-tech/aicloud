name: Piano AI P0 Checks

on:
  push:
    paths:
      - "research/piano-ai/**"
      - ".github/workflows/piano-ai-p0.yml"
  pull_request:
    paths:
      - "research/piano-ai/**"
      - ".github/workflows/piano-ai-p0.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Compile scripts
        run: python -m compileall -q research/piano-ai/scripts research/piano-ai/tests
      - name: Run standard-library tests
        run: python -m unittest discover -s research/piano-ai/tests -v
      - name: Check CLI help
        run: |
          python research/piano-ai/scripts/check_environment.py --help
          python research/piano-ai/scripts/transcribe_basic_pitch.py --help
          python research/piano-ai/scripts/validate_maestro.py --help
