name: Go Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: go test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Validate bilingual devdocs
        run: bash hack/check-devdocs-bilingual.sh

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Verify module files are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Check changed Go files are formatted
        run: |
          changed=$(git diff --name-only --diff-filter=ACMR HEAD^ -- '*.go')
          if [ -n "$changed" ]; then
            unformatted=$(gofmt -l $changed)
            if [ -n "$unformatted" ]; then
              echo "Unformatted Go files:"
              echo "$unformatted"
              exit 1
            fi
          fi

      - name: Run tests
        run: go test ./...

      - name: Run vet
        run: go vet ./...

      - name: Build entrypoints
        run: go build ./cmd/api-server ./cmd/worker ./cmd/migrate
