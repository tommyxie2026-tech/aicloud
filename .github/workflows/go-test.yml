name: Go Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: go test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Verify module files are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Generate formatting patch
        run: |
          gofmt -w $(find . -name '*.go' -not -path './vendor/*')
          git diff -- '*.go' > gofmt.patch

      - name: Upload formatting patch
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gofmt-patch
          path: gofmt.patch
          if-no-files-found: error

      - name: Check formatting
        run: test ! -s gofmt.patch

      - name: Run tests
        run: go test ./...

      - name: Run vet
        run: go vet ./...

      - name: Build entrypoints
        run: go build ./cmd/api-server ./cmd/worker ./cmd/migrate
