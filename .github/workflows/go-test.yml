name: Go Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: go test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aicloud_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aicloud_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Validate bilingual devdocs
        run: bash hack/check-devdocs-bilingual.sh

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Verify module files are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Check changed Go files are formatted
        run: |
          changed=$(git diff --name-only --diff-filter=ACMR HEAD^ -- '*.go')
          if [ -n "$changed" ]; then
            test -z "$(gofmt -l $changed)"
          fi

      - name: Run tests
        run: go test ./...

      - name: Run PostgreSQL RLS contract integration test
        env:
          AICLOUD_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/aicloud_test?sslmode=disable
        run: go test -tags=integration ./db/migrations -run TestTaskScopeMigrationPostgres -v

      - name: Run vet
        run: go vet ./...

      - name: Build entrypoints
        run: go build ./cmd/api-server ./cmd/worker ./cmd/migrate
