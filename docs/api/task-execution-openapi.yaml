openapi: 3.1.0
info:
  title: AI Cloud Task Execution API
  version: 0.2.0
  description: >-
    ECP convergence extension. /api/v1/tasks remains the canonical business Task
    API. This contract exposes immutable plan revisions and durable Executions;
    node attempts remain an observability/evidence concern rather than a second
    public Task model.
x-aicloud-status: draft
paths:
  /api/v1/tasks/{task_id}/plan:
    post:
      operationId: planTask
      parameters:
        - {name: task_id, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: A versioned execution plan was generated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExecutionPlan'}
  /api/v1/tasks/{task_id}/plans:
    get:
      operationId: listTaskPlans
      parameters:
        - {name: task_id, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Immutable plan revisions for the Task
  /api/v1/tasks/{task_id}/executions:
    post:
      operationId: createTaskExecution
      parameters:
        - {name: task_id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [goalId, planId, planRevision]
              properties:
                goalId: {type: string}
                planId: {type: string}
                planRevision: {type: integer, minimum: 1}
      responses:
        '202':
          description: Durable Execution accepted
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Execution'}
    get:
      operationId: listTaskExecutions
      parameters:
        - {name: task_id, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Execution lineage for the Task
  /api/v1/executions/{execution_id}:
    get:
      operationId: getExecution
      parameters:
        - {name: execution_id, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Durable Execution state
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Execution'}
  /api/v1/executions/{execution_id}/cancel:
    post:
      operationId: cancelExecution
      parameters:
        - {name: execution_id, in: path, required: true, schema: {type: string}}
      responses:
        '202': {description: Cancellation request accepted}
components:
  schemas:
    ExecutionPlan:
      type: object
      required: [id, goalId, revision, nodes, createdAt]
      properties:
        id: {type: string}
        goalId: {type: string}
        revision: {type: integer, minimum: 1}
        parentRevision: {type: integer, minimum: 0}
        nodes:
          type: array
          items: {$ref: '#/components/schemas/ExecutionNode'}
        createdAt: {type: string, format: date-time}
    ExecutionNode:
      type: object
      required: [id, type, effect]
      properties:
        id: {type: string}
        type:
          type: string
          enum: [model, tool, code, agent, browser, retrieval, data, workflow, human, verifier]
        dependsOn:
          type: array
          items: {type: string}
        capabilityRequirement:
          type: object
          additionalProperties: true
        effect:
          type: object
          required: [class]
          properties:
            class:
              type: string
              enum: [PURE, READ_ONLY, IDEMPOTENT_MUTATION, NON_IDEMPOTENT_MUTATION]
            idempotencyKey: {type: string}
            retrySafe: {type: boolean}
        verificationRequired: {type: boolean}
    Execution:
      type: object
      required: [id, taskId, goalId, planRef, phase, createdAt, updatedAt]
      properties:
        id: {type: string}
        taskId: {type: string}
        goalId: {type: string}
        planRef:
          type: object
          required: [planId, revision]
          properties:
            planId: {type: string}
            revision: {type: integer, minimum: 1}
        phase:
          type: string
          enum: [CREATED, PLANNING, READY, RUNNING, VERIFYING, REPLANNING, SUCCEEDED, FAILED, CANCELLED]
        conditions:
          type: array
          items:
            type: object
            additionalProperties: true
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
