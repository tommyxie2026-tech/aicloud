openapi: 3.1.0
info:
  title: AI Cloud Task Execution API
  version: 0.1.1
  description: >-
    Draft R1 execution extension. The existing /api/v1/tasks Task aggregate is
    canonical; this document adds versioned ExecutionPlan and ExecutionRun
    resources without defining a second Task domain model.
x-aicloud-status: draft
paths:
  /api/v1/tasks/{task_id}/plan:
    post:
      operationId: planTask
      parameters:
        - {name: task_id, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Versioned execution plan generated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExecutionPlan'}
  /api/v1/tasks/{task_id}/plans:
    get:
      operationId: listTaskPlans
      parameters:
        - {name: task_id, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Plan revisions
  /api/v1/tasks/{task_id}/runs:
    post:
      operationId: runTask
      parameters:
        - {name: task_id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [planId]
              properties:
                planId: {type: string}
      responses:
        '202':
          description: Execution run accepted
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExecutionRun'}
    get:
      operationId: listTaskRuns
      parameters:
        - {name: task_id, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Execution attempts for the task
  /api/v1/runs/{run_id}:
    get:
      operationId: getExecutionRun
      parameters:
        - {name: run_id, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Execution run
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExecutionRun'}
  /api/v1/runs/{run_id}/cancel:
    post:
      operationId: cancelRun
      parameters:
        - {name: run_id, in: path, required: true, schema: {type: string}}
      responses:
        '202': {description: Cancellation accepted}
components:
  schemas:
    ExecutionPlan:
      type: object
      required: [id, taskId, revision, steps, createdAt]
      properties:
        id: {type: string}
        taskId: {type: string}
        revision: {type: integer, minimum: 1}
        steps:
          type: array
          items: {$ref: '#/components/schemas/PlanStep'}
        policyDecision: {$ref: '#/components/schemas/PolicyDecision'}
        createdAt: {type: string, format: date-time}
    PlanStep:
      type: object
      required: [id, type]
      properties:
        id: {type: string}
        type: {type: string, enum: [model, agent, tool, evaluator, human]}
        capability: {type: string}
        target: {type: string}
        dependsOn:
          type: array
          items: {type: string}
    PolicyDecision:
      type: object
      required: [status]
      properties:
        id: {type: string}
        status: {type: string, enum: [allowed, denied, approval_required]}
        reason: {type: string}
    ExecutionRun:
      type: object
      required: [id, taskId, planId, attempt, phase]
      properties:
        id: {type: string}
        taskId: {type: string}
        planId: {type: string}
        attempt: {type: integer, minimum: 1}
        phase:
          type: string
          enum: [accepted, running, suspended, succeeded, failed, cancelled]
        usage:
          type: object
          properties:
            inputTokens: {type: integer, minimum: 0}
            outputTokens: {type: integer, minimum: 0}
            cacheReadTokens: {type: integer, minimum: 0}
            costUsd: {type: number, minimum: 0}
            latencyMs: {type: integer, minimum: 0}
        outcomeSuccess: {type: boolean}
        startedAt: {type: string, format: date-time}
        finishedAt: {type: string, format: date-time}
